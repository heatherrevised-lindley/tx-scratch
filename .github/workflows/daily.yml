name: Daily build

on:
  schedule:
    # 12:40 UTC is about 7:40am Central. The lottery posts its file overnight.
    - cron: "40 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # scratch.db is committed to the repo, so history survives between runs.
      - name: Pull today's data
        run: python refresh.py

      - name: Build the phone app
        run: python build_static.py -o dist --clean

      - name: Commit the updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scratch.db
          if git diff --staged --quiet; then
            echo "No data change today."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
